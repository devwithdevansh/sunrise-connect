name: sunrise_connect
description: "Sunrise Connect — parent-facing school fee management app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  google_fonts: 5.1.0

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^2.7.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8

  # PDF
  pdf: ^3.10.8
  printing: ^5.13.4
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # Firebase
  firebase_core: ^3.10.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.4

  # Audio
  audioplayers: ^5.2.1

  # Payment
  razorpay_flutter: ^1.3.7

dependency_overrides:
  google_fonts: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.jpg

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/sounds/
    - assets/animations/